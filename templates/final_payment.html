<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Payment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <script>
        function calculateTotal() {
            let pricePerHour = parseFloat(document.getElementById("pricePerHour").value);
            let duration = parseFloat(document.getElementById("duration").value);
            if (!isNaN(pricePerHour) && !isNaN(duration)) {
                document.getElementById("totalPrice").innerText = "₹" + (pricePerHour * duration).toFixed(2);
                document.getElementById("hiddenTotalPrice").value = (pricePerHour * duration).toFixed(2);
            }
        }

        function calculateEndTime() {
            let startTime = document.getElementById("start_time").value;
            let duration = parseInt(document.getElementById("duration").value);

            if (startTime && !isNaN(duration)) {
                let [hours, minutes] = startTime.split(":").map(Number);
                let endHours = hours + duration;
                let endMinutes = minutes;

                if (endHours >= 24) { 
                    endHours = endHours % 24; // Convert to 24-hour format
                }

                let formattedEndTime = `${String(endHours).padStart(2, '0')}:${String(endMinutes).padStart(2, '0')}`;
                document.getElementById("end_time_display").innerText = formattedEndTime;
                document.getElementById("end_time").value = formattedEndTime;
            }
        }

        function displayCurrentDateTime() {
        let now = new Date();

        // Extract local date and time
        let year = now.getFullYear();
        let month = String(now.getMonth() + 1).padStart(2, '0'); // Months are 0-based
        let day = String(now.getDate()).padStart(2, '0');
        let hours = String(now.getHours()).padStart(2, '0');
        let minutes = String(now.getMinutes()).padStart(2, '0');

        // Format as YYYY-MM-DD HH:MM
        let formattedDateTime = `${year}-${month}-${day} ${hours}:${minutes}`;

        // Set value in the input field
        document.getElementById("current_datetime_display").value = formattedDateTime;
    }

    // Run function when page loads
    window.onload = displayCurrentDateTime;


    </script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 500px;
            margin-top: 50px;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Final Payment</h2>
        <div class="card">
            <form action="{{ url_for('confirm_payment') }}" method="POST">
                <p><strong>Name:</strong> <input type="text" name="user_name" required class="form-control"></p>
                <p><strong>Phone Number:</strong> <input type="text" name="user_phone" required class="form-control"></p>
                
                <p><strong>Parking ID:</strong> {{ parking.id }}</p>
                <p><strong>Slot ID:</strong> {{ slot }}</p>
                <p><strong>Parking Name:</strong> {{ parking.name }}</p>
                <p><strong>Price per Hour:</strong> ₹{{ parking.price }}</p>

                <input type="hidden" name="parking_id" value="{{ parking.id }}">
                <input type="hidden" name="slot_id" value="{{ slot }}">
                <input type="hidden" name="parking_name" value="{{ parking.name }}">
                <input type="hidden" name="price_per_hour" id="pricePerHour" value="{{ parking.price }}">
                 
                <p><strong>Current Date & Time:</strong> 
                    <input type="text" name="current_datetime_display" id="current_datetime_display" class="form-control" readonly>
                </p>
                
                <p><strong>Start Date:</strong> 
                    <input type="date" name="start_date" id="start_date" required class="form-control">
                </p>

                <p><strong>Start Time:</strong> 
                    <input type="time" name="start_time" id="start_time" required class="form-control">
                </p>

                <p><strong>Duration:</strong> 
                    <input type="number" name="duration" id="duration" required class="form-control" oninput="calculateTotal(); calculateEndTime()"> hours
                </p>

                <p><strong>End Time:</strong> <span id="end_time_display">Not selected</span></p>
                <input type="hidden" name="end_time" id="end_time">

                <p><strong>Total Price:</strong> <span id="totalPrice">₹0</span></p>
                <input type="hidden" name="total_price" id="hiddenTotalPrice">

                <p><strong>Payment Method:</strong> 
                    <select name="payment_method" required class="form-control">
                        <option value="Credit/Debit Card">Credit/Debit Card</option>
                        <option value="UPI">UPI</option>
                        <option value="Net Banking">Net Banking</option>
                    </select>
                </p>

                <button type="submit" class="btn btn-success w-100">Confirm Payment</button>
            </form>
        </div>
    </div>

    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/pay.jpg') }}");
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
</body>
</html>
