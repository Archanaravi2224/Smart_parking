<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Booking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style1.css') }}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 500px;
            margin-top: 50px;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
   
    <div class="sidebar">
        <h1>Car Parking System</h1>
        <div class="nav-links"></div>
           <ul>
              <li><a href="#">Dashboard</a></li>
              <li><a href="/search_parking">Search Parking</a></li>
              <li><a href="/payment_bill">View Bills</a></li>
             
              <li><a href="/logout">Logout</a></li>
            </ul>
        </div>    
    </div>

    
        
  

</body>

<body>
    <div class="container">
        <h2 class="text-center mb-4">Booking Confirmation</h2>
        <div class="card">
            <p><strong>Parking ID:</strong> {{ parking.id }}</p>
            <p><strong>Name:</strong> {{ parking.name }}</p>
            <p><strong>Price per Hour:</strong> ₹{{ parking.price }}</p>
            <p><strong>Location:</strong> ({{ parking.latitude }}, {{ parking.longitude }})</p>
          
            <a href="{{ url_for('confirm_slots', parking_id=parking.id) }}" class="btn btn-success w-100">Select Slot</a>

        </div>
    </div>

    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/book.jpg') }}");
            background-size: cover;
            
            background-attachment: fixed;
        }
    </style>

</body>
</html>
