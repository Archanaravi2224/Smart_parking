<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Parking Spot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style1.css') }}">
    <style>
  body {
            background-color: hsla(240, 3%, 94%, 0.984);
        }
        .container {
            max-width: 700px;
            margin-top: 100px;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }


    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Car Parking System</h1>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="/search_parking">Search Parking</a></li>
            <li><a href="/payment_bill">View Bills</a></li>
           
            <li><a href="/logout">Logout</a></li>
        </ul>
    </div>    

    <div class="container">
        <h1 class="text-center mb-4">Select a Parking Spot</h1>

        <div class="card mt-3">
            <form action="/confirm_booking" method="POST">
             

                <label for="nearestParkingDropdown" class="form-label"><strong>Choose Parking:</strong></label>
                <select id="nearestParkingDropdown" name="parking_id" class="form-select" required>
                    {% for parking in nearest_parking %}
                    <option value="{{ parking.id }}">
                        {{ parking.name }} - ₹{{ parking.price }} per hour ({{ parking.distance|round(2) }} km away)
                    </option>
                    {% endfor %}
                </select>
        
                <button type="submit" class="btn btn-primary mt-3 w-100">Proceed to Booking</button>
            </form>
        </div>
        
        
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
    const dropdown = document.getElementById('nearestParkingDropdown');

    let nearestParking = JSON.parse(localStorage.getItem('nearestParking')) || [];

    if (nearestParking.length === 0) {
        console.warn("⚠️ No nearest parking found in localStorage.");
        return;
    }

    console.log("📌 Sending nearest parking to server:", nearestParking);

    // Send nearest five to Flask API
    const response = await fetch('/get_parking_details', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nearestParking })
    });

    const parkingDetails = await response.json();
    console.log("🚗 Received parking details:", parkingDetails);

    dropdown.innerHTML = '<option value="">Select Parking</option>';
    parkingDetails.forEach(spot => {
        let option = document.createElement('option');
        option.value = spot.id;
        option.textContent = `${spot.name} - ₹${spot.price} per hour`;
        dropdown.appendChild(option);
    });
});

        </script>
        

        <style>
            body {
                background-image: url("{{ url_for('static', filename='images/mapp.jpg') }}");
                background-size: cover;
                
                background-attachment: fixed;
            }
        </style>

</body>
</html>
