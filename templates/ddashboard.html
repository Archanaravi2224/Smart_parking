<!DOCTYPE html>
<html>
<head>
    <title>Dealer Dashboard</title>
    <style>
        .slot { display: inline-block; width: 50px; height: 50px; margin: 5px; text-align: center; line-height: 50px; font-weight: bold; }
        .available { background-color: rgb(248, 33, 162); color: white; }
        .booked { background-color: rgb(57, 53, 53); color: white; }
    </style>
</head>
<body>
    <h2>Welcome, {{ dealer.name }}</h2>

    <h3>Update Total Slots</h3>
    <form method="POST" action="/update_total_slots">
        <label>New Total Slots:</label>
        <input type="number" name="total_slots" value="{{ dealer.total_slots }}" required>
        <button type="submit">Update</button>
    </form>

    <h3>Slots</h3>
    <div>
        {% for slot in slots %}
            <form method="POST" action="/update_slot" style="display:inline;">
                <input type="hidden" name="slot_id" value="{{ slot.id }}">
                <input type="hidden" name="status" value="{{ 'available' if slot.status == 'booked' else 'booked' }}">
                <button class="slot {{ slot.status }}" type="submit">
                    {{ loop.index }}
                </button>
            </form>
        {% endfor %}
    </div>
    
<style>
    body {
        background-image: url("{{ url_for('static', filename='images/im2.jpg') }}");
        background-size: cover;
        
        background-attachment: fixed;
    }
</style>


    <br>
    <a href="/dlogout">Logout</a>
</body>
</html>
