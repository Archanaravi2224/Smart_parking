<!DOCTYPE html>
<html>
<head>
    <title>Dealer Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }
        .login-container {
            background: white;
            width: 300px;
            padding: 20px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #d82c99;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #714c6a;
        }
        .error {
            color: rgb(85, 78, 78);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Dealer Login</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="dealer_id" placeholder="Dealer ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    
<style>
    body {
        background-image: url("{{ url_for('static', filename='images/im2.jpg') }}");
        background-size: cover;
        
        background-attachment: fixed;
    }
</style>

</body>
</html>
